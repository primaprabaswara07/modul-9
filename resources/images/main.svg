
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450">
  <rect width="900" height="450" fill="#f5f5fa"/>
  <text x="450" y="150" text-anchor="middle"
        font-family="Arial" font-size="48" font-weight="bold"
        fill="#212529">Laravel Routing</text>
  <text x="450" y="205" text-anchor="middle"
        font-family="Arial" font-size="24" fill="#6c757d">
    Request URL → Route → Response
  </text>
  <rect x="100" y="270" width="200" height="90" rx="15"
        fill="#ffffff" stroke="#0d6efd" stroke-width="4"/>
  <rect x="350" y="270" width="200" height="90" rx="15"
        fill="#ffffff" stroke="#0d6efd" stroke-width="4"/>
  <rect x="600" y="270" width="200" height="90" rx="15"
        fill="#ffffff" stroke="#0d6efd" stroke-width="4"/>
  <g font-family="Arial" font-size="25" font-weight="bold"
     text-anchor="middle" fill="#212529">
    <text x="200" y="325">Browser</text>
    <text x="450" y="325">Route</text>
    <text x="700" y="325">Response</text>
  </g>
  <g stroke="#0d6efd" stroke-width="5" fill="none">
    <path d="M300 315 H340 M330 305 L340 315 L330 325"/>
    <path d="M550 315 H590 M580 305 L590 315 L580 325"/>
  </g>
</svg>
